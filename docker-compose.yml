version: "3.9"

services:
  backend:
    build:
      context: ../rag-api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../rag-api/.env
    environment:
      CORS_ORIGINS: "http://localhost:8765"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8765:80"
    depends_on:
      - backend
    environment:
      BACKEND_URL: "http://backend:8000"
